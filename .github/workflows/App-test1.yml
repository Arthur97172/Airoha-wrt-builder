name: 📦 Build LuCI Test1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost

          sudo apt-get clean

          echo ""
          echo "============================================================"
          echo "=== Disk space ==="
          echo "============================================================"

          df -h


      # ============================================================
      # 3. Download ImmortalWrt SDK
      # ============================================================
      - name: Download ImmortalWrt SDK
        run: |
          set -e

          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"

          # OpenWrt SDK alternative:
          # SDK_URL="https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"

          echo ""
          echo "============================================================"
          echo ">>> 下载 ImmortalWrt SDK"
          echo "============================================================"

          echo "$SDK_URL"

          wget -q \
            --show-progress \
            "$SDK_URL" \
            -O sdk.tar.zst

          echo ""
          echo ">>> 解压 SDK..."

          tar --zstd -xf sdk.tar.zst

          SDK_DIR=$(find . \
            -maxdepth 1 \
            -type d \
            -name "immortalwrt-sdk-*" \
            | head -n1)

          if [ -z "$SDK_DIR" ]; then
            echo ""
            echo "============================================================"
            echo "错误：解压后未找到 ImmortalWrt SDK 目录"
            echo "============================================================"

            ls -la

            exit 1
          fi

          echo "找到 SDK 目录: $SDK_DIR"

          mv "$SDK_DIR" sdk

          cd sdk

          echo ""
          echo "============================================================"
          echo ">>> 更新 feeds"
          echo "============================================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo ""
          echo "✓ SDK 准备完成"


      # ============================================================
      # 4. Clone and copy plugins
      # ============================================================
      - name: Clone and copy plugins
        run: |
          set -e

          cd sdk


          # ========================================================
          # 通用插件复制函数
          # ========================================================
          copy_plugin() {
            local repo_dir="$1"
            local pkg="$2"
            local found_path=""

            for path in \
              "$repo_dir/package/$pkg" \
              "$repo_dir/apps/$pkg" \
              "$repo_dir/$pkg" \
              "$repo_dir/lede/$pkg"
            do
              if [ -d "$path" ]; then
                found_path="$path"
                break
              fi
            done

            if [ -n "$found_path" ]; then

              echo ""
              echo "  ✓ 找到并复制 $pkg"
              echo "    来源: $found_path"

              cp -a \
                "$found_path" \
                package/

            else

              echo ""
              echo "  ✗ 错误：在仓库中未找到 $pkg"

              exit 1

            fi
          }


          # ========================================================
          # naoki66 / ImmortalWrt-for-Gemtek-XR1710G
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 naoki66/ImmortalWrt-for-Gemtek-XR1710G"
          echo "============================================================"

          rm -rf /tmp/naoki

          git clone \
            --depth=1 \
            -b master \
            https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git \
            /tmp/naoki

          for pkg in \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-airoha-fancontrol
          do
            copy_plugin "/tmp/naoki" "$pkg"
          done


          # ========================================================
          # YYH2913 / openwrt
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 YYH2913/openwrt"
          echo ">>> 分支: xr1710g-6.18-integration"
          echo "============================================================"

          rm -rf /tmp/yyh

          git clone \
            --depth=1 \
            -b xr1710g-6.18-integration \
            https://github.com/YYH2913/openwrt.git \
            /tmp/yyh

          for pkg in \
            luci-app-mlo \
            luci-app-w1700k-fancontrol
          do
            copy_plugin "/tmp/yyh" "$pkg"
          done


          # ========================================================
          # coolsnowwolf / luci
          #
          # 分支：
          #   openwrt-25.12
          #
          # TurboACC：
          #   applications/luci-app-turboacc
          #
          # 使用该目录自身的：
          #   Makefile
          #   po/
          #   root/
          #   htdocs/
          #
          # 由 LuCI 自动生成：
          #   luci-app-turboacc
          #   luci-i18n-turboacc-zh-cn
          #
          # 不执行：
          #   add_turboacc.sh
          #   kernel 修改
          #   firewall4 修改
          #   nftables 修改
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 coolsnowwolf/luci"
          echo ">>> 分支: openwrt-25.12"
          echo ">>> 集成 applications/luci-app-turboacc"
          echo "============================================================"

          rm -rf /tmp/coolsnowwolf-luci

          git clone \
            --depth=1 \
            -b openwrt-25.12 \
            https://github.com/coolsnowwolf/luci.git \
            /tmp/coolsnowwolf-luci

          TURBOACC_SRC="/tmp/coolsnowwolf-luci/applications/luci-app-turboacc"
          TURBOACC_DST="package/luci-app-turboacc"


          # --------------------------------------------------------
          # 检查 TurboACC 目录
          # --------------------------------------------------------
          if [ ! -d "$TURBOACC_SRC" ]; then

            echo ""
            echo "============================================================"
            echo "错误：未找到 TurboACC"
            echo "$TURBOACC_SRC"
            echo "============================================================"

            exit 1
          fi


          # --------------------------------------------------------
          # 检查 Makefile
          # --------------------------------------------------------
          if [ ! -f "$TURBOACC_SRC/Makefile" ]; then

            echo ""
            echo "错误：TurboACC Makefile 不存在"

            exit 1
          fi


          # --------------------------------------------------------
          # 检查 po 翻译目录
          # --------------------------------------------------------
          if [ ! -d "$TURBOACC_SRC/po" ]; then

            echo ""
            echo "错误：TurboACC po 目录不存在"

            exit 1
          fi


          echo ""
          echo "✓ 找到 luci-app-turboacc"
          echo "✓ 找到 Makefile"
          echo "✓ 找到 po 翻译目录"


          # --------------------------------------------------------
          # 删除旧 TurboACC
          # --------------------------------------------------------
          rm -rf "$TURBOACC_DST"


          # --------------------------------------------------------
          # 复制整个 luci-app-turboacc
          # --------------------------------------------------------
          cp -a \
            "$TURBOACC_SRC" \
            "$TURBOACC_DST"


          echo "✓ luci-app-turboacc 已复制"


          # --------------------------------------------------------
          # 显示语言文件
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo ">>> TurboACC 翻译文件"
          echo "============================================================"

          find "$TURBOACC_DST/po" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


          # --------------------------------------------------------
          # 检查中文翻译
          # --------------------------------------------------------
          if [ -d "$TURBOACC_DST/po/zh_Hans" ]; then

            echo ""
            echo "✓ 找到 zh_Hans 中文翻译目录"

          else

            echo ""
            echo "⚠️ 未找到 po/zh_Hans"

            echo ""
            echo "当前 po 目录："

            find "$TURBOACC_DST/po" \
              -maxdepth 2 \
              -type d \
              | sort

          fi


          # ========================================================
          # 显示最终集成的插件
          # ========================================================
          echo ""
          echo "============================================================"
          echo "=== 已成功整合到 package/ 的插件 ==="
          echo "============================================================"

          find package \
            -maxdepth 2 \
            -type d \
            -name "luci-app-*" \
            | sort


          # ========================================================
          # TurboACC package
          # ========================================================
          echo ""
          echo "============================================================"
          echo "=== TurboACC package ==="
          echo "============================================================"

          find "$TURBOACC_DST" \
            -maxdepth 3 \
            -type f \
            | sort


      # ============================================================
      # 5. Configure
      # ============================================================
      - name: Configure
        run: |
          set -e

          cd sdk

          echo ""
          echo "============================================================"
          echo ">>> 配置软件包"
          echo "============================================================"


          # --------------------------------------------------------
          # 原有插件
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_luci-app-airoha-flowsense=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-fancontrol=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mlo=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m" >> .config


          # --------------------------------------------------------
          # CPUFreq
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_luci-app-cpufreq=m" >> .config


          # --------------------------------------------------------
          # libubox
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_libubox=m" >> .config


          # --------------------------------------------------------
          # TurboACC
          #
          # 来源：
          # coolsnowwolf/luci
          # openwrt-25.12
          #
          # applications/luci-app-turboacc
          #
          # 这里只编译 LuCI package。
          #
          # 不执行：
          #   add_turboacc.sh
          #   kernel patch
          #   firewall4 patch
          #   nftables patch
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_luci-app-turboacc=m" >> .config


          # --------------------------------------------------------
          # 生成最终配置
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo ">>> 执行 make defconfig"
          echo "============================================================"

          make defconfig


          # --------------------------------------------------------
          # 显示最终配置
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "=== 最终配置 ==="
          echo "============================================================"

          grep -E \
            'CONFIG_PACKAGE_luci-app-airoha-flowsense|\
          CONFIG_PACKAGE_luci-app-airoha-npu|\
          CONFIG_PACKAGE_luci-app-airoha-fancontrol|\
          CONFIG_PACKAGE_luci-app-mlo|\
          CONFIG_PACKAGE_luci-app-w1700k-fancontrol|\
          CONFIG_PACKAGE_luci-app-cpufreq|\
          CONFIG_PACKAGE_luci-app-turboacc|\
          CONFIG_PACKAGE_libubox' \
            .config \
            || true


          echo ""
          echo "✓ 配置完成"


      # ============================================================
      # 6. Compile packages
      # ============================================================
      - name: Compile packages
        run: |
          set -e

          cd sdk

          PLUGINS="\
          libubox \
          luci-app-airoha-flowsense \
          luci-app-airoha-npu \
          luci-app-airoha-fancontrol \
          luci-app-mlo \
          luci-app-w1700k-fancontrol \
          luci-app-cpufreq \
          luci-app-turboacc"


          # ========================================================
          # 逐个编译
          # ========================================================
          for pkg in $PLUGINS; do

            echo ""
            echo "============================================================"
            echo "======== 开始编译 $pkg ========"
            echo "============================================================"

            if make \
              "package/$pkg/compile" \
              V=s \
              -j"$(nproc)"
            then

              echo "✓ $pkg 并行编译成功"

            else

              echo "⚠ $pkg 并行编译失败"
              echo ">>> 开始单线程重新编译..."

              make \
                "package/$pkg/compile" \
                V=s \
                -j1

              echo "✓ $pkg 单线程编译成功"

            fi

          done


          # ========================================================
          # TurboACC APK 检查
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 检查 TurboACC 编译结果"
          echo "============================================================"

          TURBOACC_APKS=$(find bin/packages \
            -type f \
            \( \
              -name "luci-app-turboacc*.apk" \
              -o \
              -name "luci-i18n-turboacc-zh-cn*.apk" \
            \) \
            | sort || true)


          if [ -n "$TURBOACC_APKS" ]; then

            echo "$TURBOACC_APKS"

          else

            echo ""
            echo "⚠️ 没有找到 TurboACC APK"
            echo ""
            echo ">>> 搜索所有 turboacc 文件："

            find bin \
              -type f \
              | grep -i turboacc \
              | sort \
              || true

          fi


          echo ""
          echo "============================================================"
          echo "======== 全部插件编译完成 ========"
          echo "============================================================"


      # ============================================================
      # 7. Collect APK packages
      # ============================================================
      - name: Collect packages (.apk) to apps/
        run: |
          set -e

          mkdir -p apps


          echo ""
          echo "============================================================"
          echo ">>> 清理旧 APK"
          echo "============================================================"


          # --------------------------------------------------------
          # Airoha FlowSense
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-flowsense*.apk
          rm -f apps/luci-i18n-airoha-flowsense-zh-cn*.apk


          # --------------------------------------------------------
          # Airoha NPU
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-npu*.apk
          rm -f apps/luci-i18n-airoha-npu-zh-cn*.apk


          # --------------------------------------------------------
          # W1700K FanControl
          # --------------------------------------------------------
          rm -f apps/luci-app-w1700k-fancontrol*.apk
          rm -f apps/luci-i18n-w1700k-fancontrol*.apk


          # --------------------------------------------------------
          # Airoha FanControl
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-fancontrol*.apk
          rm -f apps/luci-i18n-airoha-fancontrol*.apk


          # --------------------------------------------------------
          # CPUFreq
          # --------------------------------------------------------
          rm -f apps/cpufreq*.apk
          rm -f apps/luci-app-cpufreq*.apk
          rm -f apps/luci-i18n-cpufreq-zh-cn*.apk


          # --------------------------------------------------------
          # MLO
          # --------------------------------------------------------
          rm -f apps/luci-app-mlo*.apk
          rm -f apps/luci-i18n-mlo-zh-cn*.apk


          # --------------------------------------------------------
          # libubox
          # --------------------------------------------------------
          rm -f apps/libubox*.apk


          # --------------------------------------------------------
          # TurboACC
          # --------------------------------------------------------
          rm -f apps/luci-app-turboacc*.apk
          rm -f apps/luci-i18n-turboacc-zh-cn*.apk


          # ========================================================
          # 搜索全部 APK
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 搜索编译生成的 APK"
          echo "============================================================"

          find sdk/bin \
            -type f \
            -name "*.apk" \
            | sort


          # ========================================================
          # 复制目标 APK
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 复制目标 APK 到 apps/"
          echo "============================================================"

          find sdk/bin \
            -type f \
            -name "*.apk" \
            | while read -r f; do

              filename="$(basename "$f")"

              case "$filename" in

                # --------------------------------------------------
                # Airoha FlowSense
                # --------------------------------------------------
                luci-app-airoha-flowsense*|\
                luci-i18n-airoha-flowsense-zh-cn*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # Airoha NPU
                # --------------------------------------------------
                luci-app-airoha-npu*|\
                luci-i18n-airoha-npu-zh-cn*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # W1700K FanControl
                # --------------------------------------------------
                luci-app-w1700k-fancontrol*|\
                luci-i18n-w1700k-fancontrol*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # Airoha FanControl
                # --------------------------------------------------
                luci-app-airoha-fancontrol*|\
                luci-i18n-airoha-fancontrol*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # CPUFreq
                # --------------------------------------------------
                cpufreq*|\
                luci-app-cpufreq*|\
                luci-i18n-cpufreq-zh-cn*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # MLO
                # --------------------------------------------------
                luci-app-mlo*|\
                luci-i18n-mlo-zh-cn*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # libubox
                # --------------------------------------------------
                libubox*)

                  cp -v "$f" apps/
                  ;;


                # --------------------------------------------------
                # TurboACC
                # --------------------------------------------------
                luci-app-turboacc*|\
                luci-i18n-turboacc-zh-cn*)

                  cp -v "$f" apps/
                  ;;

              esac

            done


          # ========================================================
          # 强制检查 TurboACC
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 检查 apps/ 中的 TurboACC"
          echo "============================================================"

          TURBOACC_COUNT=$(find apps \
            -type f \
            \( \
              -name "luci-app-turboacc*.apk" \
              -o \
              -name "luci-i18n-turboacc-zh-cn*.apk" \
            \) \
            | wc -l)


          find apps \
            -type f \
            \( \
              -name "luci-app-turboacc*.apk" \
              -o \
              -name "luci-i18n-turboacc-zh-cn*.apk" \
            \) \
            | sort


          echo ""
          echo "TurboACC APK 数量: $TURBOACC_COUNT"


          if [ "$TURBOACC_COUNT" -lt 2 ]; then

            echo ""
            echo "============================================================"
            echo "错误：TurboACC APK 不完整"
            echo "需要至少："
            echo "  1. luci-app-turboacc*.apk"
            echo "  2. luci-i18n-turboacc-zh-cn*.apk"
            echo "============================================================"

            echo ""
            echo ">>> bin 中所有 TurboACC 文件："

            find sdk/bin \
              -type f \
              | grep -i turboacc \
              | sort \
              || true

            exit 1

          fi


          # ========================================================
          # 最终结果
          # ========================================================
          echo ""
          echo "============================================================"
          echo "=== 最终已放置到 apps/ 的文件 ==="
          echo "============================================================"

          ls -lh apps/ || true


          echo ""
          echo "APK 总数量："

          find apps \
            -type f \
            -name "*.apk" \
            | wc -l


      # ============================================================
      # 8. Upload Artifacts
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-immortalwrt-an7581

          path: |
            apps/luci-app-airoha-flowsense*.apk
            apps/luci-i18n-airoha-flowsense-zh-cn*.apk

            apps/luci-app-airoha-npu*.apk
            apps/luci-i18n-airoha-npu-zh-cn*.apk

            apps/luci-app-w1700k-fancontrol*.apk
            apps/luci-i18n-w1700k-fancontrol*.apk

            apps/luci-app-airoha-fancontrol*.apk
            apps/luci-i18n-airoha-fancontrol*.apk

            apps/cpufreq*.apk
            apps/luci-app-cpufreq*.apk
            apps/luci-i18n-cpufreq-zh-cn*.apk

            apps/luci-app-mlo*.apk
            apps/luci-i18n-mlo-zh-cn*.apk

            apps/libubox*.apk

            apps/luci-app-turboacc*.apk
            apps/luci-i18n-turboacc-zh-cn*.apk

          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 9. Commit and Push apps/
      # ============================================================
      - name: Commit and Push apps/
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "=== 提交并推送编译结果到 apps/ 目录 ==="
          echo "============================================================"


          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add apps/


          if git diff --staged --quiet; then

            echo ""
            echo "没有需要提交的变更"
            echo "apps/ 目录没有变化"

          else

            git commit \
              -m "build: update compiled apk files in apps/ ($(date +%Y%m%d))"


            echo ""
            echo ">>> 获取远程最新代码..."

            git fetch origin


            echo ""
            echo ">>> 尝试 rebase..."

            git rebase "origin/${{ github.ref_name }}" \
              || git rebase origin/main


            echo ""
            echo ">>> 推送 APK..."

            git push \
              origin \
              "HEAD:${{ github.ref_name }}"


            echo ""
            echo "============================================================"
            echo "✅ 成功将编译后的 APK 推送到仓库"
            echo "============================================================"

          fi
