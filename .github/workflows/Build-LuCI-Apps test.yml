name: 📦 Build LuCI Apps Test

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and sync wifi7-manager packages
        run: |
          # 1. 创建或清空 apps 目录
          mkdir -p apps
          rm -f apps/*.apk 2>/dev/null || true

          # 2. 获取仓库最新 Release 并下载所有 _all.apk 文件
          echo ">>> 正在同步 mt7996-wifi7-manager 仓库..."
          RESPONSE=$(curl -sL "https://api.github.com/repos/woziwrt/mt7996-wifi7-manager/releases/latest")

          for url in $(echo "$RESPONSE" | jq -r '.assets[] | select(.name | test("_all\\.apk$")) | .browser_download_url'); do
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              ORIG_NAME=$(basename "$url")
              [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
              
              curl -sL "$url" -o "apps/$FILE_NAME" 2>/dev/null && echo "  下载成功: $FILE_NAME"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
          else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt APK 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              git pull --rebase origin main || git rebase --abort
              git push origin main
          fi
