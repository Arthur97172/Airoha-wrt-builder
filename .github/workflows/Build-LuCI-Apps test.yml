name: 📦 Build LuCI Apps Test

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and sync wifi7-manager packages
        run: |
          # 1. 创建 apps 目录
          mkdir -p apps

          # 2. 通过 GitHub Contents API 获取仓库文件列表（这里以根目录为例，如果是子目录请修改路径，如 /apps）
          echo ">>> 正在获取 woziwrt/mt7996-wifi7-manager 仓库文件列表..."
          RESPONSE=$(curl -sL "https://api.github.com/repos/woziwrt/mt7996-wifi7-manager/contents/")

          # 安全检查：确保返回的是数组
          if ! echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null; then
            echo "❌ 错误：未能获取到仓库目录内容！API 响应："
            echo "$RESPONSE" | head -n 20
            exit 1
          fi

          # 3. 筛选并下载所有结尾为 .apk 的文件
          echo "$RESPONSE" | jq -r '.[] | select(.name | endswith(".apk")) | .download_url' | while read -r url; do
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              ORIG_NAME=$(basename "$url")
              [[ "$ORIG_NAME" == *luci* ]] && FILE_NAME="luci${ORIG_NAME##*luci}" || FILE_NAME="$ORIG_NAME"
              
              echo "  下载: $FILE_NAME"
              curl -sL "$url" -o "apps/$FILE_NAME"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
              echo "没有检测到文件更改，跳过提交"
          else
              git diff --staged --stat
              git commit -m "自动同步 OpenWrt APK 软件包 - $(date +'%Y-%m-%d %H:%M:%S')"
              
              git pull --rebase origin main || git rebase --abort
              git push origin main
          fi
