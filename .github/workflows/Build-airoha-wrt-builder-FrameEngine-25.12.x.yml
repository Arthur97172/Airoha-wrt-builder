```yaml
name: 📦 Build airoha-wrt-25.12.x Frame Engine

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: "选择 OpenWrt/ImmortalWrt"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - immortalwrt
          - openwrt

      luci_version:
        description: "选择版本"
        required: false
        default: "snapshots"
        type: choice
        options:
          - snapshots

      profile:
        type: choice
        description: |
          输入软路由型号
        options:
          - airoha_an7581-evb-emmc-eagle
          - airoha_an7581-evb-emmc-kite
          - airoha_an7581-evb
          - gemtek_w1700k-ubi
          - nokia_valyrian
          - nokia_xg-040g-md
          - nokia_xg-040g-md-ubi
        required: true
        default: "gemtek_w1700k-ubi"

      ipaddr:
        description: "请设置软路由管理地址，格式：192.168.x.1"
        required: true
        default: "192.168.10.1"

      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - yes
          - no

env:
  FINAL_LUCI_VER: ${{ inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🖥️ 服务器信息
        run: |
          echo "========================================"
          echo "CPU"
          echo "========================================"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo
          echo "========================================"
          echo "Memory"
          echo "========================================"
          free -h

          echo
          echo "========================================"
          echo "Disk"
          echo "========================================"
          df -Th

      - name: 🛠️ 安装编译依赖
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd \
            qemu-utils \
            genisoimage \
            swig \
            time

      - name: ⚙️ 设置脚本权限
        run: |
          set -e

          chmod +x airoha/openwrt_repositories || true
          chmod +x airoha/immortalwrt_repositories || true
          chmod +x shell/prepare-packages.sh || true
          chmod +x shell/openwrt-custom-packages.sh || true
          chmod +x shell/immortalwrt-custom-packages.sh || true

      - name: ⚙️ 修改自定义配置
        run: |
          set -e

          CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
          BANNER_PATH="./files/etc/banner"

          echo "当前网络配置路径: $CONFIG_PATH"

          if [ -f "$CONFIG_PATH" ]; then
            sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$CONFIG_PATH"
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"

            echo "✅ 99-custom.sh:"
            cat "$CONFIG_PATH"
          fi

          if [ -f "$BANNER_PATH" ]; then
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$BANNER_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$BANNER_PATH"

            echo
            echo "✅ banner:"
            cat "$BANNER_PATH"
          fi

      - name: ⬇️ 获取源码
        run: |
          set -e

          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            git clone \
              --depth=1 \
              --branch openwrt-25.12 \
              https://github.com/openwrt/openwrt.git \
              source
          else
            git clone \
              --depth=1 \
              https://github.com/immortalwrt/immortalwrt.git \
              source
          fi

          cd source

          echo "========================================"
          echo "Source"
          echo "========================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current

      - name: 📡 配置 feeds
        working-directory: ./source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 📦 导入自定义 feeds
        run: |
          set -e

          if [ -f "files/customfeeds/25.customfeeds.list" ]; then
            mkdir -p source

            cp files/customfeeds/25.customfeeds.list \
              source/customfeeds-25.list

            echo "========================================"
            echo "Custom feeds"
            echo "========================================"

            cat source/customfeeds-25.list
          fi

      - name: 📁 复制自定义 files
        run: |
          set -e

          mkdir -p source/files/etc/uci-defaults
          mkdir -p source/files/etc/apk/repositories.d

          if [ -f files/etc/uci-defaults/99-custom.sh ]; then
            cp files/etc/uci-defaults/99-custom.sh \
              source/files/etc/uci-defaults/

            chmod +x \
              source/files/etc/uci-defaults/99-custom.sh
          fi

          if [ -f files/etc/uci-defaults/99-wireless-defaults ]; then
            cp files/etc/uci-defaults/99-wireless-defaults \
              source/files/etc/uci-defaults/

            chmod +x \
              source/files/etc/uci-defaults/99-wireless-defaults
          fi

          if [ -f files/etc/banner ]; then
            cp files/etc/banner \
              source/files/etc/banner
          fi

          if [ -f files/customfeeds/25.customfeeds.list ]; then
            cat files/customfeeds/25.customfeeds.list \
              >> source/files/etc/apk/repositories.d/customfeeds.list
          fi

      - name: 🎯 配置 AN7581 Target
        working-directory: ./source
        run: |
          set -e

          cat > an7581-frame-engine.config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          EOF

          PROFILE="${{ inputs.profile }}"

          case "$PROFILE" in

            airoha_an7581-evb-emmc-eagle)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-eagle=y" \
                >> an7581-frame-engine.config
              ;;

            airoha_an7581-evb-emmc-kite)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-kite=y" \
                >> an7581-frame-engine.config
              ;;

            airoha_an7581-evb)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_airoha_an7581-evb=y" \
                >> an7581-frame-engine.config
              ;;

            gemtek_w1700k-ubi)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_w1700k-ubi=y" \
                >> an7581-frame-engine.config
              ;;

            nokia_valyrian)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_valyrian=y" \
                >> an7581-frame-engine.config
              ;;

            nokia_xg-040g-md)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y" \
                >> an7581-frame-engine.config
              ;;

            nokia_xg-040g-md-ubi)
              echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y" \
                >> an7581-frame-engine.config
              ;;

            *)
              echo "❌ Unknown profile: $PROFILE"
              exit 1
              ;;
          esac

          cat an7581-frame-engine.config

          ./scripts/config \
            --enable CONFIG_TARGET_airoha \
            --enable CONFIG_TARGET_airoha_an7581

          DEVICE_SYMBOL="CONFIG_TARGET_airoha_an7581_DEVICE_${PROFILE}"

          ./scripts/config \
            --enable "$DEVICE_SYMBOL"

          make defconfig

          echo
          echo "========================================"
          echo "Target verification"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET.*DEVICE' \
            .config | grep -E \
            'airoha|an7581|gemtek|nokia' || true

      - name: 🧩 自动启用 Kernel CONFIG_DEVMEM
        working-directory: ./source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching kernel configuration"
          echo "========================================"

          FOUND=0

          while IFS= read -r cfg; do

            if grep -qE \
              '^CONFIG_DEVMEM=|^# CONFIG_DEVMEM is not set|CONFIG_DEVMEM' \
              "$cfg" 2>/dev/null; then

              echo "Patching kernel config:"
              echo "  $cfg"

              if grep -q '^CONFIG_DEVMEM=' "$cfg"; then
                sed -i \
                  's/^CONFIG_DEVMEM=.*/CONFIG_DEVMEM=y/' \
                  "$cfg"

              elif grep -q '^# CONFIG_DEVMEM is not set' "$cfg"; then
                sed -i \
                  's/^# CONFIG_DEVMEM is not set/CONFIG_DEVMEM=y/' \
                  "$cfg"

              else
                echo 'CONFIG_DEVMEM=y' >> "$cfg"
              fi

              if grep -q '^CONFIG_STRICT_DEVMEM=' "$cfg"; then
                sed -i \
                  's/^CONFIG_STRICT_DEVMEM=.*/# CONFIG_STRICT_DEVMEM is not set/' \
                  "$cfg"
              elif ! grep -q '^# CONFIG_STRICT_DEVMEM is not set' "$cfg"; then
                echo '# CONFIG_STRICT_DEVMEM is not set' >> "$cfg"
              fi

              FOUND=1
            fi

          done < <(
            find target/linux/airoha \
              -type f \
              \( \
                -name '*.config' \
                -o -name 'config-*' \
              \) \
              2>/dev/null
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ Existing CONFIG_DEVMEM definition not found."

            echo
            echo "Creating kernel config fragment."

            mkdir -p target/linux/airoha/an7581

            cat > target/linux/airoha/an7581/90-frame-engine.config <<'EOF'
          CONFIG_DEVMEM=y
          # CONFIG_STRICT_DEVMEM is not set
          EOF

            cat target/linux/airoha/an7581/90-frame-engine.config
          fi

      - name: 🧩 启用 BusyBox devmem
        working-directory: ./source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BusyBox devmem"
          echo "========================================"

          BUSYBOX_DIR="package/utils/busybox"

          if [ ! -d "$BUSYBOX_DIR" ]; then
            echo "❌ BusyBox source directory not found"
            exit 1
          fi

          echo "BusyBox directory:"
          echo "$BUSYBOX_DIR"

          echo
          echo "Searching BusyBox configuration..."

          CONFIG_FILES=$(find "$BUSYBOX_DIR" \
            -type f \
            \( \
              -name '*.config' \
              -o -name 'config-*' \
            \) \
            2>/dev/null || true)

          if [ -z "$CONFIG_FILES" ]; then
            echo "❌ No BusyBox config files found"
            exit 1
          fi

          FOUND=0

          while IFS= read -r cfg; do

            [ -z "$cfg" ] && continue

            if grep -qE \
              'BUSYBOX_DEFAULT_DEVMEM|BUSYBOX_CONFIG_DEVMEM|CONFIG_DEVMEM' \
              "$cfg" 2>/dev/null; then

              echo "Patching:"
              echo "  $cfg"

              if grep -q '^CONFIG_BUSYBOX_DEFAULT_DEVMEM=' "$cfg"; then
                sed -i \
                  's/^CONFIG_BUSYBOX_DEFAULT_DEVMEM=.*/CONFIG_BUSYBOX_DEFAULT_DEVMEM=y/' \
                  "$cfg"
              fi

              if grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=' "$cfg"; then
                sed -i \
                  's/^CONFIG_BUSYBOX_CONFIG_DEVMEM=.*/CONFIG_BUSYBOX_CONFIG_DEVMEM=y/' \
                  "$cfg"
              fi

              FOUND=1
            fi

          done <<< "$CONFIG_FILES"

          echo
          echo "Forcing OpenWrt BusyBox configuration..."

          if grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=' .config; then
            sed -i \
              's/^CONFIG_BUSYBOX_CONFIG_DEVMEM=.*/CONFIG_BUSYBOX_CONFIG_DEVMEM=y/' \
              .config
          else
            echo 'CONFIG_BUSYBOX_CONFIG_DEVMEM=y' >> .config
          fi

          echo 'CONFIG_PACKAGE_busybox=y' >> .config

          make defconfig

          echo
          echo "Final BusyBox configuration:"
          grep -E \
            'CONFIG_BUSYBOX_CONFIG_DEVMEM|CONFIG_PACKAGE_busybox' \
            .config || true

      - name: 📦 启用 Frame Engine / NPU packages
        working-directory: ./source
        run: |
          set -e

          ./scripts/config \
            --enable CONFIG_PACKAGE_luci-app-airoha-npu

          make defconfig

          echo "========================================"
          echo "NPU package"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_luci-app-airoha-npu=' \
            .config || true

      - name: 🐳 配置 Docker
        if: inputs.include_docker == 'yes'
        working-directory: ./source
        run: |
          set -e

          ./scripts/config --enable CONFIG_PACKAGE_dockerd
          ./scripts/config --enable CONFIG_PACKAGE_docker
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-dockerman

          make defconfig

          echo "Docker enabled."

      - name: 🔍 最终配置检查
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET.*DEVICE' \
            .config | grep -E \
            'airoha|an7581|gemtek|nokia' || true

          echo
          echo "========================================"
          echo "KERNEL"
          echo "========================================"

          grep -E \
            '^CONFIG_DEVMEM=|^# CONFIG_DEVMEM|^CONFIG_STRICT_DEVMEM=|^# CONFIG_STRICT_DEVMEM' \
            .config || true

          echo
          echo "========================================"
          echo "BUSYBOX"
          echo "========================================"

          grep -E \
            '^CONFIG_BUSYBOX_CONFIG_DEVMEM=|^CONFIG_PACKAGE_busybox=' \
            .config || true

          echo
          echo "========================================"
          echo "NPU"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_luci-app-airoha-npu=' \
            .config || true

          echo
          echo "========================================"
          echo "Validation"
          echo "========================================"

          if ! grep -q '^CONFIG_DEVMEM=y' .config; then
            echo "❌ CONFIG_DEVMEM=y is missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=y' .config; then
            echo "❌ CONFIG_BUSYBOX_CONFIG_DEVMEM=y is missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_PACKAGE_luci-app-airoha-npu=y' .config; then
            echo "❌ luci-app-airoha-npu is missing"
            exit 1
          fi

          echo
          echo "✅ CONFIG_DEVMEM=y"
          echo "✅ CONFIG_BUSYBOX_CONFIG_DEVMEM=y"
          echo "✅ luci-app-airoha-npu=y"

      - name: 📥 下载源码包
        working-directory: ./source
        run: |
          set -e

          make download -j$(nproc) V=s

      - name: 🧱 编译固件
        working-directory: ./source
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          set -e

          make -j$(nproc) V=s

      - name: 🔎 验证编译后的 BusyBox
        working-directory: ./source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching compiled BusyBox"
          echo "========================================"

          BUSYBOX_BIN=$(find build_dir \
            -type f \
            -path '*busybox*/busybox' \
            -perm -111 \
            2>/dev/null | head -n 1 || true)

          if [ -z "$BUSYBOX_BIN" ]; then
            echo "⚠️ Compiled BusyBox binary not found."
            echo "The package may already have been cleaned."
          else
            echo "BusyBox:"
            echo "$BUSYBOX_BIN"

            echo
            echo "Checking devmem applet..."

            if "$BUSYBOX_BIN" --list-full 2>/dev/null | \
              grep -qx 'devmem'; then
              echo "✅ BusyBox devmem applet found"
            elif "$BUSYBOX_BIN" --list 2>/dev/null | \
              grep -qx 'devmem'; then
              echo "✅ BusyBox devmem applet found"
            else
              echo "❌ BusyBox devmem applet NOT found"
              exit 1
            fi
          fi

      - name: 📦 检查最终固件
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Airoha AN7581 images"
          echo "========================================"

          find bin/targets/airoha/an7581 \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*sysupgrade*' \
              -o -name '*factory*' \
              -o -name '*.itb' \
            \) \
            -print

          echo
          echo "========================================"
          echo "Image size"
          echo "========================================"

          du -h \
            bin/targets/airoha/an7581/* \
            2>/dev/null || true

      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 📜 生成发布说明
        run: |
          cat > router-info.md <<EOF
          ## 📡 Airoha AN7581 Router

          📌 Firmware:
          ${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}

          🏠 Management IP:
          ${{ inputs.ipaddr }}

          👤 Username:
          root

          🔑 Password:
          无

          📶 WiFi Password:
          12345678

          🐳 Docker:
          ${{ inputs.include_docker == 'yes' && '已集成' || '未集成' }}

          ## Frame Engine

          Kernel CONFIG_DEVMEM:
          enabled

          BusyBox devmem:
          enabled

          luci-app-airoha-npu:
          enabled

          Profile:
          ${{ inputs.profile }}

          ## Verification

          This firmware was built from source instead of ImageBuilder.

          Kernel /dev/mem support and BusyBox devmem were explicitly enabled
          for Airoha Frame Engine register access.
          EOF

      - name: 🚀 上传 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.date.outputs.date }}-${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-airoha-an7581-FRAME-ENGINE-Docker-${{ inputs.include_docker }}

          body_path: router-info.md

          files: |
            source/bin/targets/airoha/an7581/*squashfs-sysupgrade.*
            source/bin/targets/airoha/an7581/*squashfs-factory.*
            source/bin/targets/airoha/an7581/*.itb
            source/bin/targets/airoha/an7581/*.bin

          token: ${{ secrets.GITHUB_TOKEN }}
```
