name: 📦 Build devmem2 for AN7581

on:
  #schedule:
    #- cron: '0 22 */7 * *'  # 每7日凌晨6点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download ImmortalWrt SDK
        run: |
          set -e
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          
          echo ">>> 下载 ImmortalWrt SDK: $SDK_URL"
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          
          echo ">>> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst
          
          SDK_DIR=$(find . -maxdepth 1 -type d -name "immortalwrt-sdk-*" | head -n1)
          if [ -z "$SDK_DIR" ]; then
            echo "错误：解压后未找到匹配的 SDK 目录"
            ls -la
            exit 1
          fi
          
          echo "找到 SDK 目录: $SDK_DIR"
          mv "$SDK_DIR" sdk

      - name: Compile devmem2 using SDK Toolchain
        run: |
          set -e
          echo ">>> 正在准备编译 devmem2..."
          
          # 1. 下载 devmem2 源码
          curl -sL https://raw.githubusercontent.com/radii/devmem2/master/devmem2.c -o devmem2.c
          
          # 2. 寻找 SDK 中的交叉编译器 (aarch64-openwrt-linux-musl-gcc)
          STAGING_DIR=$(ls -d sdk/staging_dir/toolchain-*)
          export PATH="$STAGING_DIR/bin:$PATH"
          
          # 获取实际的编译器前缀
          CC=$(find "$STAGING_DIR/bin" -name "*-gcc" | head -n1)
          if [ -z "$CC" ]; then
            echo "错误：未在 SDK 中找到交叉编译器"
            exit 1
          fi
          
          echo "使用交叉编译器: $CC"
          
          # 3. 静态交叉编译
          $CC -static devmem2.c -o devmem2
          chmod +x devmem2
          echo "devmem2 编译成功！"

      - name: Collect binary to apps/
        run: |
          set -e
          mkdir -p apps
          
          # 清理旧文件并放入新编译的二进制
          rm -f apps/devmem apps/devmem2
          cp devmem2 apps/devmem2
          
          echo ""
          echo "=== 最终已放置到 apps/ 的文件 ==="
          ls -lh apps/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devmem-an7581
          path: |
            apps/devmem2
          if-no-files-found: error
          retention-days: 30

      - name: Commit and Push apps/
        run: |
          echo "=== 提交并推送编译结果到 apps/ 目录 ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/

          if git diff --staged --quiet; then
            echo "没有需要提交的变更 (apps/ 目录没有变化)"
          else
            echo "📦 检测到以下文件变更："
            git diff --staged --stat
            git commit -m "build: update compiled devmem2 binary in apps/ ($(date +%Y%m%d))"
            git fetch origin
            git rebase origin/${{ github.ref_name }} || git rebase origin/main
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ 成功将编译后的二进制推送到仓库"
          fi
