name: 📦 Build LuCI Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost

          sudo apt-get clean

          echo "=== Disk space ==="
          df -h


      # ============================================================
      # 3. Download ImmortalWrt SDK
      # ============================================================
      - name: Download ImmortalWrt SDK
        run: |
          set -e

          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"

          # OpenWrt SDK alternative:
          # SDK_URL="https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"

          echo ">>> 下载 ImmortalWrt SDK:"
          echo "$SDK_URL"

          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst

          echo ">>> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst

          SDK_DIR=$(find . -maxdepth 1 -type d -name "immortalwrt-sdk-*" | head -n1)

          if [ -z "$SDK_DIR" ]; then
            echo "错误：解压后未找到匹配的 SDK 目录"
            ls -la
            exit 1
          fi

          echo "找到 SDK 目录: $SDK_DIR"

          mv "$SDK_DIR" sdk

          cd sdk

          echo ">>> 更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo ">>> SDK 准备完成"


      # ============================================================
      # 4. Clone and copy plugins
      # ============================================================
      - name: Clone and copy plugins
        run: |
          set -e

          cd sdk

          # --------------------------------------------------------
          # 通用插件复制函数
          # --------------------------------------------------------
          copy_plugin() {
            local repo_dir="$1"
            local pkg="$2"
            local found_path=""

            for path in \
              "$repo_dir/package/$pkg" \
              "$repo_dir/apps/$pkg" \
              "$repo_dir/$pkg" \
              "$repo_dir/lede/$pkg"
            do
              if [ -d "$path" ]; then
                found_path="$path"
                break
              fi
            done

            if [ -n "$found_path" ]; then
              echo "  ✓ 找到并复制 $pkg"
              echo "    来源: $found_path"

              cp -a "$found_path" package/

            else
              echo "  ✗ 错误：在仓库中未找到 $pkg"
              exit 1
            fi
          }


          # ========================================================
          # naoki66 / ImmortalWrt-for-Gemtek-XR1710G
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 naoki66/ImmortalWrt-for-Gemtek-XR1710G"
          echo "============================================================"

          git clone \
            --depth=1 \
            -b master \
            https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git \
            /tmp/naoki

          for pkg in \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-airoha-fancontrol
          do
            copy_plugin "/tmp/naoki" "$pkg"
          done


          # ========================================================
          # YYH2913 / openwrt
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 YYH2913/openwrt"
          echo ">>> 分支: xr1710g-6.18-integration"
          echo "============================================================"

          git clone \
            --depth=1 \
            -b xr1710g-6.18-integration \
            https://github.com/YYH2913/openwrt.git \
            /tmp/yyh

          for pkg in \
            luci-app-mlo \
            luci-app-w1700k-fancontrol
          do
            copy_plugin "/tmp/yyh" "$pkg"
          done


          # ========================================================
          # mufeng05 / turboacc
          #
          # 方案 A：
          # 只复制 luci-app-turboacc
          #
          # 不执行 add_turboacc.sh
          # 不修改 kernel/firewall4/nftables
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 克隆 mufeng05/turboacc"
          echo ">>> 仅集成 luci-app-turboacc"
          echo "============================================================"

          git clone \
            --depth=1 \
            https://github.com/mufeng05/turboacc.git \
            /tmp/turboacc

          if [ ! -d "/tmp/turboacc/custom/luci-app-turboacc" ]; then
            echo "错误：未找到 turboacc/custom/luci-app-turboacc"
            exit 1
          fi

          mkdir -p package/turboacc

          cp -a \
            /tmp/turboacc/custom/luci-app-turboacc \
            package/turboacc/

          echo "✓ luci-app-turboacc 已复制"


          # ========================================================
          # 显示最终集成的插件
          # ========================================================
          echo ""
          echo "============================================================"
          echo "=== 已成功整合到 package/ 的插件 ==="
          echo "============================================================"

          find package \
            -maxdepth 2 \
            -type d \
            -name "luci-app-*" \
            | sort

          echo ""
          echo "=== TurboACC package ==="
          find package/turboacc \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 5. Configure
      # ============================================================
      - name: Configure
        run: |
          set -e

          cd sdk

          echo ""
          echo "============================================================"
          echo ">>> 配置软件包"
          echo "============================================================"

          # --------------------------------------------------------
          # 原有插件
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_luci-app-airoha-flowsense=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-fancontrol=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mlo=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-cpufreq=m"

          # --------------------------------------------------------
          # libubox
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_libubox=m" >> .config

          # --------------------------------------------------------
          # TurboACC
          #
          # 只启用：
          #   1. Flow Offloading
          #   2. BBR
          #
          # 明确关闭：
          #   - FullCone NAT
          #   - Fast Classifier
          #   - Shortcut-FE
          # --------------------------------------------------------
          echo "CONFIG_PACKAGE_luci-app-turboacc=m" >> .config

          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_FLOW_OFFLOADING=y" >> .config
          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_BBR_CCA=y" >> .config

          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_FULLCONE=n" >> .config
          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_FAST_CLASSIFIER=n" >> .config
          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_SHORTCUT_FE_CM=n" >> .config
          echo "CONFIG_PACKAGE_TURBOACC_INCLUDE_NO_FASTPATH=n" >> .config


          # --------------------------------------------------------
          # 生成最终配置
          # --------------------------------------------------------
          echo ""
          echo ">>> 执行 make defconfig..."
          make defconfig


          # --------------------------------------------------------
          # 显示 TurboACC 最终配置
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "=== TurboACC 最终配置 ==="
          echo "============================================================"

          grep -E \
            "CONFIG_PACKAGE_luci-app-turboacc|CONFIG_PACKAGE_TURBOACC_" \
            .config \
            || true

          echo ""
          echo "配置完成"


      # ============================================================
      # 6. Compile packages
      # ============================================================
      - name: Compile packages
        run: |
          set -e

          cd sdk

          PLUGINS="\
          libubox \
          luci-app-airoha-flowsense \
          luci-app-airoha-npu \
          luci-app-airoha-fancontrol \
          luci-app-mlo \
          luci-app-w1700k-fancontrol \
          luci-app-cpufreq \
          luci-app-turboacc"

          for pkg in $PLUGINS; do

            echo ""
            echo "============================================================"
            echo "======== 开始编译 $pkg ========"
            echo "============================================================"

            if make "package/$pkg/compile" V=s -j"$(nproc)"; then
              echo "✓ $pkg 并行编译成功"
            else
              echo "⚠ $pkg 并行编译失败，开始单线程重新编译..."

              make "package/$pkg/compile" V=s -j1

              echo "✓ $pkg 单线程编译成功"
            fi

          done

          echo ""
          echo "============================================================"
          echo "======== 全部插件编译完成 ========"
          echo "============================================================"


      # ============================================================
      # 7. Collect APK packages
      # ============================================================
      - name: Collect packages (.apk) to apps/
        run: |
          set -e

          mkdir -p apps

          echo ""
          echo "============================================================"
          echo ">>> 清理旧 APK"
          echo "============================================================"

          # --------------------------------------------------------
          # Airoha FlowSense
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-flowsense*.apk
          rm -f apps/luci-i18n-airoha-flowsense-zh-cn*.apk

          # --------------------------------------------------------
          # Airoha NPU
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-npu*.apk
          rm -f apps/luci-i18n-airoha-npu-zh-cn*.apk

          # --------------------------------------------------------
          # W1700K FanControl
          # --------------------------------------------------------
          rm -f apps/luci-app-w1700k-fancontrol*.apk
          rm -f apps/luci-i18n-w1700k-fancontrol*.apk

          # --------------------------------------------------------
          # Airoha FanControl
          # --------------------------------------------------------
          rm -f apps/luci-app-airoha-fancontrol*.apk
          rm -f apps/luci-i18n-airoha-fancontrol*.apk

          # --------------------------------------------------------
          # CPUFreq
          # --------------------------------------------------------
          rm -f apps/cpufreq*.apk
          rm -f apps/luci-app-cpufreq*.apk
          rm -f apps/luci-i18n-cpufreq-zh-cn*.apk

          # --------------------------------------------------------
          # MLO
          # --------------------------------------------------------
          rm -f apps/luci-app-mlo*.apk
          rm -f apps/luci-i18n-mlo-zh-cn*.apk

          # --------------------------------------------------------
          # libubox
          # --------------------------------------------------------
          rm -f apps/libubox*.apk

          # --------------------------------------------------------
          # TurboACC
          # --------------------------------------------------------
          rm -f apps/luci-app-turboacc*.apk
          rm -f apps/luci-i18n-turboacc-zh-cn*.apk


          # ========================================================
          # 提取编译完成的 APK
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 搜索编译生成的 APK"
          echo "============================================================"

          find sdk/bin \
            -type f \
            -name "*.apk" \
            | sort


          # ========================================================
          # 复制目标 APK
          # ========================================================
          echo ""
          echo "============================================================"
          echo ">>> 复制目标 APK 到 apps/"
          echo "============================================================"

          find sdk/bin \
            -type f \
            -name "*.apk" \
            | while read -r f; do

              filename="$(basename "$f")"

              case "$filename" in

                # --------------------------------------------------
                # Airoha FlowSense
                # --------------------------------------------------
                luci-app-airoha-flowsense*|\
                luci-i18n-airoha-flowsense-zh-cn*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # Airoha NPU
                # --------------------------------------------------
                luci-app-airoha-npu*|\
                luci-i18n-airoha-npu-zh-cn*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # W1700K FanControl
                # --------------------------------------------------
                luci-app-w1700k-fancontrol*|\
                luci-i18n-w1700k-fancontrol*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # Airoha FanControl
                # --------------------------------------------------
                luci-app-airoha-fancontrol*|\
                luci-i18n-airoha-fancontrol*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # CPUFreq
                # --------------------------------------------------
                cpufreq*|\
                luci-app-cpufreq*|\
                luci-i18n-cpufreq-zh-cn*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # MLO
                # --------------------------------------------------
                luci-app-mlo*|\
                luci-i18n-mlo-zh-cn*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # libubox
                # --------------------------------------------------
                libubox*)

                  cp -v "$f" apps/
                  ;;

                # --------------------------------------------------
                # TurboACC
                # --------------------------------------------------
                luci-app-turboacc*|\
                luci-i18n-turboacc-zh-cn*)

                  cp -v "$f" apps/
                  ;;

              esac

            done


          # ========================================================
          # 最终结果
          # ========================================================
          echo ""
          echo "============================================================"
          echo "=== 最终已放置到 apps/ 的文件 ==="
          echo "============================================================"

          ls -lh apps/ || true

          echo ""
          echo "APK 总数量:"
          find apps \
            -type f \
            -name "*.apk" \
            | wc -l


      # ============================================================
      # 8. Upload Artifacts
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-immortalwrt-an7581
          path: |
            apps/luci-app-airoha-flowsense*.apk
            apps/luci-i18n-airoha-flowsense-zh-cn*.apk

            apps/luci-app-airoha-npu*.apk
            apps/luci-i18n-airoha-npu-zh-cn*.apk

            apps/luci-app-w1700k-fancontrol*.apk
            apps/luci-i18n-w1700k-fancontrol*.apk

            apps/luci-app-airoha-fancontrol*.apk
            apps/luci-i18n-airoha-fancontrol*.apk

            apps/cpufreq*.apk
            apps/luci-app-cpufreq*.apk
            apps/luci-i18n-cpufreq-zh-cn*.apk

            apps/luci-app-mlo*.apk
            apps/luci-i18n-mlo-zh-cn*.apk

            apps/libubox*.apk

            apps/luci-app-turboacc*.apk
            apps/luci-i18n-turboacc-zh-cn*.apk

          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 9. Commit and Push apps/
      # ============================================================
      - name: Commit and Push apps/
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "=== 提交并推送编译结果到 apps/ 目录 ==="
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/

          if git diff --staged --quiet; then

            echo "没有需要提交的变更"
            echo "apps/ 目录没有变化"

          else

            git commit \
              -m "build: update compiled apk files in apps/ ($(date +%Y%m%d))"

            echo ">>> 获取远程最新代码..."
            git fetch origin

            echo ">>> 尝试 rebase..."
            git rebase "origin/${{ github.ref_name }}" \
              || git rebase origin/main

            echo ">>> 推送 APK..."
            git push \
              origin \
              "HEAD:${{ github.ref_name }}"

            echo ""
            echo "✅ 成功将编译后的 APK 推送到仓库"

          fi
