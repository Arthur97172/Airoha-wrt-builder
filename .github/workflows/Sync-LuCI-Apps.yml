name: 📦 Build & Sync LuCI Apps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 1. 编译插件并发布到本地 Release
      # ==========================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download ImmortalWrt SDK
        run: |
          set -e
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          
          echo ">>> 下载 ImmortalWrt SDK: $SDK_URL"
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          
          echo ">>> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst
          
          SDK_DIR=$(find . -maxdepth 1 -type d -name "immortalwrt-sdk-*" | head -n1)
          if [ -z "$SDK_DIR" ]; then
            echo "错误：解压后未找到匹配的 SDK 目录"
            ls -la
            exit 1
          fi
          
          echo "找到 SDK 目录: $SDK_DIR"
          mv "$SDK_DIR" sdk
          
          cd sdk
          echo ">>> 更新 feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "SDK 准备完成"

      - name: Clone and copy plugins
        run: |
          set -e
          cd sdk

          copy_plugin() {
            local repo_dir="$1"
            local pkg="$2"
            local found_path=""

            for path in "$repo_dir/package/$pkg" "$repo_dir/apps/$pkg" "$repo_dir/$pkg"; do
              if [ -d "$path" ]; then
                found_path="$path"
                break
              fi
            done

            if [ -n "$found_path" ]; then
              echo "  ✓ 找到并复制 $pkg ($found_path)"
              cp -a "$found_path" package/
            else
              echo "  ✗ 错误：在仓库中未找到 $pkg"
              exit 1
            fi
          }

          # 克隆 naoki66 仓库
          echo ">>> 克隆 naoki66/ImmortalWrt-for-Gemtek-XR1710G (master)..."
          git clone --depth=1 -b master https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git /tmp/naoki
          for pkg in luci-app-airoha-flowsense luci-app-airoha-npu luci-app-airoha-fancontrol; do
            copy_plugin "/tmp/naoki" "$pkg"
          done

          # 克隆 YYH2913 仓库
          echo ">>> 克隆 YYH2913/openwrt (xr1710g-6.18-integration)..."
          git clone --depth=1 -b xr1710g-6.18-integration https://github.com/YYH2913/openwrt.git /tmp/yyh
          for pkg in luci-app-mlo luci-app-w1700k-fancontrol; do
            copy_plugin "/tmp/yyh" "$pkg"
          done

          echo ""
          echo "=== 已成功整合到 package/ 目录的插件 ==="
          ls -d package/luci-app-*

      - name: Configure
        run: |
          set -e
          cd sdk

          echo "CONFIG_PACKAGE_luci-app-airoha-flowsense=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-npu=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-airoha-fancontrol=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mlo=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m" >> .config

          make defconfig
          echo "配置完成"

      - name: Compile packages
        run: |
          set -e
          cd sdk

          PLUGINS="luci-app-airoha-flowsense luci-app-airoha-npu luci-app-airoha-fancontrol luci-app-mlo luci-app-w1700k-fancontrol"

          for pkg in $PLUGINS; do
            echo ""
            echo "======== 开始编译 $pkg ========"
            make package/$pkg/compile V=s -j$(nproc) || make package/$pkg/compile V=s -j1
          done

          echo ""
          echo "======== 全部 5 个插件编译完成 ========"

      - name: Collect packages (.apk)
        run: |
          mkdir -p output

          find sdk/bin -name "*.apk" | while read -r f; do
            case "$(basename "$f")" in
              *airoha-flowsense*|*airoha-npu*|*mlo*|*w1700k-fancontrol*|*airoha-fancontrol*)
                cp -v "$f" output/
                ;;
            esac
          done

          echo ""
          echo "=== 最终生成的文件 ==="
          ls -lh output/ || echo "未找到任何包文件"

          echo ""
          echo "apk 总数量: $(find output -name '*.apk' | wc -l)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-immortalwrt-an7581
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          DATE=$(date +%Y.%m.%d)
          TAG="Apps"
          RELEASE_NAME="Apps ${DATE}"

          echo "Release 标签: $TAG"
          echo "Release 名称: $RELEASE_NAME"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "已存在同名 Release，直接上传并覆盖已有文件..."
            gh release upload "$TAG" output/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "创建新 Release..."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_NAME" \
              --notes "基于 ImmortalWrt SDK 编译的 Airoha AN7581 LuCI 插件包" \
              output/*
          fi

      # ==========================================
      # 2. 自动同步第三方 Release 中的 APK 到 apps/ 目录并提交推送
      # ==========================================
      - name: Sync Release APKs to apps/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 开始获取 Arthur97172/Airoha-wrt-builder 最新 Release 中的 .apk 文件 ==="
          mkdir -p apps
          rm -f apps/*.apk

          # 使用 GitHub CLI 自动下载第三方 Release 中最新的 .apk 文件
          gh release download --repo Arthur97172/Airoha-wrt-builder --pattern "*.apk" --dir apps --clobber

          echo ""
          echo "=== 验证结果 ==="
          if ls apps/*.apk 1> /dev/null 2>&1; then
            echo "✅ 成功获取以下 APK 文件："
            ls -lh apps/*.apk
          else
            echo "⚠️ 警告：未在第三方最新 Release 中找到任何 .apk 文件！"
          fi

      - name: Commit and Push apps/
        run: |
          echo "=== 提交并推送同步结果 ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/

          # 检查是否有文件变更，避免未修改时 commit 导致报错
          if git diff --staged --quiet; then
            echo "没有需要提交的变更 (apps/ 目录没有变化)"
          else
            git commit -m "sync: fetch latest release apk files for W1700K ($(date +%Y%m%d))"
            git fetch origin
            git rebase origin/${{ github.ref_name }} || git rebase origin/main
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ 成功推送变动到仓库"
          fi
