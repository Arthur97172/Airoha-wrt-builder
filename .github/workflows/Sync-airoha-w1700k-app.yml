name: Sync APP Files

on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作 / Action'
        type: choice
        required: true
        default: 'sync'
        options:
          - sync
          - clear

permissions:
  contents: write

jobs:
  sync-target:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync Release APKs to apps/
        if: github.event.inputs.action == 'sync'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 开始获取 Arthur97172/Gemtek-XR1710G-wrt-builder 最新 Release 中的 .apk 文件 ==="
          mkdir -p apps

          # 1. 先清理本地 apps 目录下旧的 apk 文件，确保与最新 Release 保持同步
          rm -f apps/*.apk

          # 2. 使用 GitHub CLI 自动下载最新 Release 中所有的 *.apk 文件
          gh release download --repo Arthur97172/Gemtek-XR1710G-wrt-builder --pattern "*.apk" --dir apps --clobber

          echo ""
          echo "=== 验证结果 ==="
          if ls apps/*.apk 1> /dev/null 2>&1; then
            echo "✅ 成功获取以下 APK 文件："
            ls -lh apps/*.apk
          else
            echo "⚠️ 警告：未在最新 Release 中找到任何 .apk 文件！"
          fi

      - name: Clear Target Files
        if: github.event.inputs.action == 'clear'
        run: |
          echo "=== 清理 apps/ 目录下的所有 .apk 文件 ==="
          if [ -d "apps" ]; then
            rm -f apps/*.apk
            echo "✅ 已清理 apps/ 下的所有 .apk 文件"
          fi

          echo ""
          echo "正在提交清理..."
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/ 2>/dev/null || true
          git commit -m "clear: remove downloaded apk files from apps/ ($(date +%Y%m%d))" || echo "无需提交"

          echo ""
          echo "=== 推送前同步远程 ==="
          git fetch origin
          git rebase origin/main
          git push || echo "推送失败"
          echo "✅ 清理完成"

      - name: Commit and Push
        if: github.event.inputs.action == 'sync'
        run: |
          echo "=== 推送前同步远程 ==="
          git fetch origin
          git rebase origin/main
          echo ""
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/
          git commit -m "sync: fetch latest release apk files from Arthur97172/Gemtek-XR1710G-wrt-builder ($(date +%Y%m%d))" || echo "无需提交"
          git push || echo "推送失败"
          echo "✅ 同步完成"
