name: 📦 Build airoha-wrt-25.12.x-eng

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: "选择OpenWrt/Immortalwrt"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - 'immortalwrt'
          - 'openwrt'

      luci_version:
        description: "选择luci版本"
        required: false
        default: "snapshots"
        type: choice
        options:
          - 'snapshots'

      profile:
        type: choice
        description: |
          输入软路由型号
        options:
          - airoha_an7581-evb-emmc-eagle
          - airoha_an7581-evb-emmc-kite
          - airoha_an7581-evb
          - gemtek_w1700k-ubi
          - nokia_valyrian
          - nokia_xg-040g-md
          - nokia_xg-040g-md-ubi
        required: true
        default: 'gemtek_w1700k-ubi'

      ipaddr:
        description: "请设置软路由的管理地址,格式:192.168.x.1"
        required: true
        default: "192.168.10.1"

      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  FINAL_LUCI_VER: ${{ inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 服务器信息
        run: |
          echo "------------------------------- CPU -------------------------------"
          nproc
          echo "------------------------------- 内存 -------------------------------"
          free -h
          echo "------------------------------- 磁盘 -------------------------------"
          df -Th

      - name: 🛠️ 安装编译依赖
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd \
            qemu-utils \
            genisoimage \
            swig \
            time

      - name: ⚙️ 设置脚本权限
        run: |
          set -e

          chmod +x airoha/build25.sh || true
          chmod +x airoha/openwrt_repositories || true
          chmod +x airoha/immortalwrt_repositories || true
          chmod +x shell/prepare-packages.sh || true
          chmod +x shell/openwrt-custom-packages.sh || true
          chmod +x shell/immortalwrt-custom-packages.sh || true

      - name: ⚙️ 设置自定义 IP 和 Banner
        run: |
          set -e

          CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
          BANNER_PATH="./files/etc/banner"

          echo "当前网络配置路径: $CONFIG_PATH"

          if [ -f "$CONFIG_PATH" ]; then
            sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$CONFIG_PATH"
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"

            echo "✅ 99-custom.sh:"
            cat "$CONFIG_PATH"
          fi

          if [ -f "$BANNER_PATH" ]; then
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$BANNER_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$BANNER_PATH"

            echo "✅ banner:"
            cat "$BANNER_PATH"
          fi

      - name: ⬇️ 下载 OpenWrt / ImmortalWrt Source
        run: |
          set -e

          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            git clone --depth=1 \
              --branch openwrt-25.12 \
              https://github.com/openwrt/openwrt.git \
              source
          else
            git clone --depth=1 \
              https://github.com/immortalwrt/immortalwrt.git \
              source
          fi

          cd source

          echo "Source revision:"
          git rev-parse HEAD

      - name: 🔄 更新 feeds
        working-directory: ./source
        run: |
          set -e

          ./scripts/feeds update -a

      - name: 📦 准备现有 APK
        run: |
          set -e

          rm -rf apk-packages
          mkdir -p apk-packages

          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            cp shell/openwrt-custom-packages.sh apk-packages/custom-packages.sh
          else
            cp shell/immortalwrt-custom-packages.sh apk-packages/custom-packages.sh
          fi

          chmod +x apk-packages/custom-packages.sh

          echo "========================================"
          echo "Custom APK script"
          echo "========================================"

          cat apk-packages/custom-packages.sh

      - name: 📦 安装基础 feeds
        working-directory: ./source
        run: |
          set -e

          ./scripts/feeds install base
          ./scripts/feeds install luci
          ./scripts/feeds install packages

      - name: 🎯 配置 AN7581 Target
        working-directory: ./source
        run: |
          set -e

          PROFILE="${{ inputs.profile }}"

          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_${PROFILE}=y
          EOF

          echo "========================================"
          echo "Target configuration"
          echo "========================================"

          cat .config

      - name: 🔧 Enable Kernel CONFIG_DEVMEM
        working-directory: ./source
        run: |
          set -e

          mkdir -p target/linux/airoha/an7581

          cat > target/linux/airoha/an7581/90-frame-engine.config <<'EOF'
          CONFIG_DEVMEM=y
          # CONFIG_STRICT_DEVMEM is not set
          EOF

          echo "========================================"
          echo "Kernel Frame Engine config"
          echo "========================================"

          cat target/linux/airoha/an7581/90-frame-engine.config

      - name: 🔧 Enable BusyBox devmem
        working-directory: ./source
        run: |
          set -e

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_busybox=y
          CONFIG_BUSYBOX_CONFIG_DEVMEM=y
          EOF

          echo "========================================"
          echo "BusyBox devmem"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_busybox=|^CONFIG_BUSYBOX_CONFIG_DEVMEM=' \
            .config || true

      - name: ⚙️ 生成基础配置
        working-directory: ./source
        run: |
          set -e

          make defconfig

          echo "========================================"
          echo "Final target configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET.*DEVICE' \
            .config || true

          echo "========================================"
          echo "BusyBox configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_busybox=|^CONFIG_BUSYBOX_CONFIG_DEVMEM=' \
            .config || true

      - name: 🔧 准备 Kernel
        working-directory: ./source
        run: |
          set -e

          make target/linux/prepare V=s

      - name: 🔍 验证 Kernel CONFIG_DEVMEM
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Searching kernel .config"
          echo "========================================"

          find build_dir \
            -path '*/linux-*/.config' \
            -type f \
            -print || true

          KERNEL_CONFIG=$(find build_dir \
            -path '*/linux-*/.config' \
            -type f \
            | head -n 1)

          if [ -z "$KERNEL_CONFIG" ]; then
            echo "❌ Kernel .config not found"
            exit 1
          fi

          echo "Kernel config:"
          echo "$KERNEL_CONFIG"

          echo
          echo "DEVMEM configuration:"

          grep -E \
            '^CONFIG_DEVMEM=|^# CONFIG_DEVMEM|^CONFIG_STRICT_DEVMEM=|^# CONFIG_STRICT_DEVMEM' \
            "$KERNEL_CONFIG" || true

          if ! grep -q '^CONFIG_DEVMEM=y' "$KERNEL_CONFIG"; then
            echo "❌ CONFIG_DEVMEM=y was NOT enabled"
            exit 1
          fi

          echo "✅ CONFIG_DEVMEM=y enabled"

      - name: 📦 配置 Airoha NPU
        working-directory: ./source
        run: |
          set -e

          if [ "${{ inputs.profile }}" = "gemtek_w1700k-ubi" ]; then

            echo "========================================"
            echo "Airoha NPU APK support"
            echo "========================================"

            echo "NPU APK will be injected after firmware build."

          fi

      - name: ⚙️ 配置 Docker
        working-directory: ./source
        run: |
          set -e

          if [ "${{ inputs.include_docker }}" = "yes" ]; then
            echo "CONFIG_PACKAGE_dockerd=y" >> .config
            echo "CONFIG_PACKAGE_docker=y" >> .config
            echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          fi

          make defconfig

      - name: 📥 下载源码包
        working-directory: ./source
        run: |
          set -e

          make download -j$(nproc)

      - name: 🧱 编译固件
        working-directory: ./source
        run: |
          set -e

          make -j$(nproc) V=s

      - name: 🔍 检查 BusyBox devmem
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Checking BusyBox devmem"
          echo "========================================"

          BUSYBOX_BIN=$(find build_dir \
            -type f \
            -path '*/busybox-*/busybox' \
            | head -n 1 || true)

          if [ -z "$BUSYBOX_BIN" ]; then
            echo "⚠️ BusyBox binary not found in expected path"
          else
            echo "BusyBox: $BUSYBOX_BIN"

            if "$BUSYBOX_BIN" --list | grep -qx "devmem"; then
              echo "✅ BusyBox devmem is enabled"
            else
              echo "❌ BusyBox devmem is NOT enabled"
              exit 1
            fi
          fi

      - name: 📦 收集固件
        run: |
          set -e

          mkdir -p release

          find source/bin/targets/airoha/an7581 \
            -type f \
            \( \
              -name '*squashfs-sysupgrade*' \
              -o \
              -name '*squashfs-factory*' \
            \) \
            -exec cp {} release/ \;

          echo "========================================"
          echo "Firmware"
          echo "========================================"

          ls -lh release

      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 📜 生成发布说明
        run: |
          cat > router-info.md <<EOF
          ## 📡 路由器后台信息

          📌 版本：${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}

          🏠 后台地址：${{ inputs.ipaddr }}

          👤 用户名：root

          🔑 密码：无

          📶 WiFi密码：12345678

          🐳 Docker状态：${{ inputs.include_docker == 'yes' && '已集成' || '未集成' }}

          ## Frame Engine

          Kernel:
          CONFIG_DEVMEM=y

          BusyBox:
          devmem enabled

          Profile:
          ${{ inputs.profile }}
          EOF

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.date.outputs.date }}-${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-airoha-an7581-RELEASE-Docker-${{ inputs.include_docker }}
          body_path: router-info.md
          files: |
            release/*
          token: ${{ secrets.GITHUB_TOKEN }}
