name: 📦 Build airoha-wrt-25.12.x-eng

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: "选择 OpenWrt/ImmortalWrt"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - 'immortalwrt'
          - 'openwrt'

      luci_version:
        description: "选择版本"
        required: false
        default: "snapshots"
        type: choice
        options:
          - 'snapshots'

      profile:
        type: choice
        description: "输入软路由型号"
        options:
          - airoha_an7581-evb-emmc-eagle
          - airoha_an7581-evb-emmc-kite
          - airoha_an7581-evb
          - gemtek_w1700k-ubi
          - nokia_valyrian
          - nokia_xg-040g-md
          - nokia_xg-040g-md-ubi
        required: true
        default: 'gemtek_w1700k-ubi'

      ipaddr:
        description: "请设置软路由的管理地址，例如 192.168.10.1"
        required: true
        default: "192.168.10.1"

      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  FINAL_LUCI_VER: ${{ inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: 服务器信息
        run: |
          echo "========================================"
          echo "CPU"
          echo "========================================"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo "========================================"
          echo "Memory"
          echo "========================================"
          free -h

          echo "========================================"
          echo "Disk"
          echo "========================================"
          df -Th

      - name: 🛠️ 安装编译依赖
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            curl \
            zstd \
            file \
            tree \
            qemu-utils \
            genisoimage \
            swig \
            time \
            xsltproc \
            libelf-dev \
            device-tree-compiler

      - name: ⚙️ 设置脚本权限
        run: |
          set -e

          chmod +x shell/prepare-packages.sh || true
          chmod +x shell/openwrt-custom-packages.sh || true
          chmod +x shell/immortalwrt-custom-packages.sh || true

      - name: ⚙️ 设置 IP 和 Banner
        run: |
          set -e

          CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
          BANNER_PATH="./files/etc/banner"

          echo "========================================"
          echo "Custom network configuration"
          echo "========================================"

          if [ -f "$CONFIG_PATH" ]; then
            sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$CONFIG_PATH"
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"

            cat "$CONFIG_PATH"
          else
            echo "⚠️ $CONFIG_PATH not found"
          fi

          echo "========================================"
          echo "Banner"
          echo "========================================"

          if [ -f "$BANNER_PATH" ]; then
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$BANNER_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$BANNER_PATH"

            cat "$BANNER_PATH"
          else
            echo "⚠️ $BANNER_PATH not found"
          fi

      - name: ⬇️ Clone Source
        run: |
          set -e

          rm -rf source

          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            git clone \
              --depth=1 \
              --branch openwrt-25.12 \
              https://github.com/openwrt/openwrt.git \
              source
          else
            git clone \
              --depth=1 \
              https://github.com/immortalwrt/immortalwrt.git \
              source
          fi

          cd source

          echo "========================================"
          echo "Source revision"
          echo "========================================"

          git rev-parse HEAD
          git log -1 --oneline

      - name: 🔄 更新 feeds
        working-directory: ./source
        run: |
          set -e

          ./scripts/feeds update -a

      - name: 📦 安装必要 feeds
        working-directory: ./source
        run: |
          set -e

          ./scripts/feeds install base
          ./scripts/feeds install luci
          ./scripts/feeds install packages

      - name: 🎯 配置 AN7581 Target
        working-directory: ./source
        run: |
          set -e

          PROFILE="${{ inputs.profile }}"

          cat > .config <<EOF
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_${PROFILE}=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_PACKAGE_busybox=y
          CONFIG_BUSYBOX_CONFIG_DEVMEM=y
          EOF

          echo "========================================"
          echo "Target"
          echo "========================================"

          cat .config

      - name: 🔧 Enable Kernel CONFIG_DEVMEM
        working-directory: ./source
        run: |
          set -e

          mkdir -p target/linux/airoha/an7581

          cat > target/linux/airoha/an7581/90-frame-engine.config <<'EOF'
          CONFIG_DEVMEM=y
          # CONFIG_STRICT_DEVMEM is not set
          EOF

          echo "========================================"
          echo "Kernel Frame Engine config"
          echo "========================================"

          cat target/linux/airoha/an7581/90-frame-engine.config

      - name: 🔧 Enable BusyBox devmem
        working-directory: ./source
        run: |
          set -e

          grep -q '^CONFIG_PACKAGE_busybox=y' .config || \
            echo 'CONFIG_PACKAGE_busybox=y' >> .config

          grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=y' .config || \
            echo 'CONFIG_BUSYBOX_CONFIG_DEVMEM=y' >> .config

          echo "========================================"
          echo "BusyBox config"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_busybox=|^CONFIG_BUSYBOX_CONFIG_DEVMEM=' \
            .config || true

      - name: 📦 配置 LuCI
        working-directory: ./source
        run: |
          set -e

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-base=y
          EOF

      - name: 📦 配置 Docker
        working-directory: ./source
        run: |
          set -e

          if [ "${{ inputs.include_docker }}" = "yes" ]; then
            echo "CONFIG_PACKAGE_dockerd=y" >> .config
            echo "CONFIG_PACKAGE_docker=y" >> .config
            echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          fi

      - name: 📦 准备自定义 APK
        run: |
          set -e

          rm -rf prebuilt-apk
          mkdir -p prebuilt-apk

          if [ "${{ inputs.profile }}" != "gemtek_w1700k-ubi" ]; then
            echo "Profile is not gemtek_w1700k-ubi"
            echo "Skip Airoha custom APK"
            exit 0
          fi

          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            CUSTOM_SCRIPT="shell/openwrt-custom-packages.sh"
          else
            CUSTOM_SCRIPT="shell/immortalwrt-custom-packages.sh"
          fi

          echo "========================================"
          echo "Custom APK source"
          echo "========================================"

          if [ ! -f "$CUSTOM_SCRIPT" ]; then
            echo "❌ Custom package script not found:"
            echo "$CUSTOM_SCRIPT"
            exit 1
          fi

          cp "$CUSTOM_SCRIPT" prebuilt-apk/custom-packages.sh

          echo "Using:"
          echo "$CUSTOM_SCRIPT"

      - name: 📥 获取现成 Airoha APK
        if: inputs.profile == 'gemtek_w1700k-ubi'
        run: |
          set -e

          echo "========================================"
          echo "Preparing Airoha prebuilt APK"
          echo "========================================"

          mkdir -p prebuilt-apk

          if [ -f "shell/prepare-packages.sh" ]; then
            cp shell/prepare-packages.sh prebuilt-apk/
            chmod +x prebuilt-apk/prepare-packages.sh
          fi

          if [ -f "prebuilt-apk/custom-packages.sh" ]; then
            echo "Custom package script copied."
          fi

          echo
          echo "Searching repository for existing APK files..."

          find . \
            -type f \
            \( \
              -name 'luci-app-airoha-npu*.apk' \
              -o -name 'luci-app-mlo*.apk' \
              -o -name 'luci-app-airoha-flowsense*.apk' \
              -o -name 'luci-app-airoha-fancontrol*.apk' \
            \) \
            -print \
            2>/dev/null || true

      - name: 🧩 创建 Airoha Prebuilt Package
        if: inputs.profile == 'gemtek_w1700k-ubi'
        run: |
          set -e

          mkdir -p source/package/airoha-prebuilt/files

          cat > source/package/airoha-prebuilt/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=airoha-prebuilt
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/airoha-prebuilt
            SECTION:=luci
            CATEGORY:=LuCI
            TITLE:=Airoha prebuilt LuCI applications
            DEPENDS:=+luci-base
          endef

          define Package/airoha-prebuilt/description
            Prebuilt Airoha LuCI applications for AN7581.
          endef

          define Build/Prepare
          endef

          define Build/Compile
          endef

          define Package/airoha-prebuilt/install
            $(INSTALL_DIR) $(1)/tmp/airoha-prebuilt
            $(INSTALL_DATA) ./files/*.apk $(1)/tmp/airoha-prebuilt/ 2>/dev/null || true
          endef

          $(eval $(call BuildPackage,airoha-prebuilt))
          EOF

          touch source/package/airoha-prebuilt/files/.keep

      - name: 🔧 生成 Source 配置
        working-directory: ./source
        run: |
          set -e

          make defconfig

          echo "========================================"
          echo "Final target configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_airoha|^CONFIG_TARGET.*DEVICE' \
            .config || true

          echo
          echo "========================================"
          echo "Kernel / BusyBox"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_busybox=|^CONFIG_BUSYBOX_CONFIG_DEVMEM=' \
            .config || true

      - name: 🔧 准备 Kernel
        working-directory: ./source
        run: |
          set -e

          make target/linux/prepare V=s

      - name: 🔍 检查 Kernel 配置
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Kernel configuration"
          echo "========================================"

          KERNEL_CONFIG=$(find build_dir \
            -type f \
            -path '*/linux-*/.config' \
            | head -n 1 || true)

          if [ -n "$KERNEL_CONFIG" ]; then
            echo "Kernel config:"
            echo "$KERNEL_CONFIG"

            grep -E \
              '^CONFIG_DEVMEM=|^# CONFIG_DEVMEM|^CONFIG_STRICT_DEVMEM=|^# CONFIG_STRICT_DEVMEM' \
              "$KERNEL_CONFIG" || true
          else
            echo "⚠️ Kernel .config not generated yet."
            echo "Kernel config fragment:"
            cat target/linux/airoha/an7581/90-frame-engine.config
          fi

      - name: 📥 下载源码
        working-directory: ./source
        run: |
          set -e

          make download -j$(nproc)

      - name: 🧱 编译固件
        working-directory: ./source
        run: |
          set -e

          make -j$(nproc) V=s

      - name: 🔍 验证 Kernel CONFIG_DEVMEM
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Verify Kernel CONFIG_DEVMEM"
          echo "========================================"

          KERNEL_CONFIG=$(find build_dir \
            -type f \
            -path '*/linux-*/.config' \
            | head -n 1 || true)

          if [ -z "$KERNEL_CONFIG" ]; then
            echo "❌ Kernel .config not found after build"
            exit 1
          fi

          echo "Kernel config:"
          echo "$KERNEL_CONFIG"

          grep -E \
            '^CONFIG_DEVMEM=|^# CONFIG_DEVMEM|^CONFIG_STRICT_DEVMEM=|^# CONFIG_STRICT_DEVMEM' \
            "$KERNEL_CONFIG" || true

          if ! grep -q '^CONFIG_DEVMEM=y' "$KERNEL_CONFIG"; then
            echo "❌ CONFIG_DEVMEM=y NOT enabled"
            exit 1
          fi

          echo "✅ CONFIG_DEVMEM=y"

      - name: 🔍 验证 BusyBox devmem
        working-directory: ./source
        run: |
          set -e

          echo "========================================"
          echo "Verify BusyBox devmem"
          echo "========================================"

          if ! grep -q '^CONFIG_BUSYBOX_CONFIG_DEVMEM=y' .config; then
            echo "❌ CONFIG_BUSYBOX_CONFIG_DEVMEM=y NOT enabled"
            exit 1
          fi

          echo "✅ CONFIG_BUSYBOX_CONFIG_DEVMEM=y"

          BUSYBOX_BIN=$(find build_dir \
            -type f \
            -path '*/busybox-*/busybox' \
            | head -n 1 || true)

          if [ -n "$BUSYBOX_BIN" ]; then
            echo "BusyBox:"
            echo "$BUSYBOX_BIN"

            if "$BUSYBOX_BIN" --list | grep -qx "devmem"; then
              echo "✅ BusyBox devmem applet exists"
            else
              echo "❌ BusyBox devmem applet not found"
              exit 1
            fi
          else
            echo "⚠️ BusyBox binary path not found."
            echo "Configuration is enabled, firmware build completed."
          fi

      - name: 📦 检查最终固件
        run: |
          set -e

          TARGET_DIR="source/bin/targets/airoha/an7581"

          echo "========================================"
          echo "Firmware output"
          echo "========================================"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "❌ Target directory not found:"
            echo "$TARGET_DIR"
            exit 1
          fi

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

      - name: 📦 收集固件
        run: |
          set -e

          rm -rf release
          mkdir -p release

          find source/bin/targets/airoha/an7581 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*sysupgrade*' \
              -o \
              -name '*factory*' \
              -o \
              -name '*recovery*' \
            \) \
            -exec cp {} release/ \;

          echo "========================================"
          echo "Release files"
          echo "========================================"

          ls -lh release

      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 📜 生成发布说明
        run: |
          cat > router-info.md <<EOF
          ## 📡 路由器后台信息

          📌 系统：${{ env.WRT_NAME }}

          📌 版本：${{ env.FINAL_LUCI_VER }}

          📌 Profile：${{ inputs.profile }}

          🏠 后台地址：http://${{ inputs.ipaddr }}

          👤 用户名：root

          🔑 密码：无

          📶 WiFi密码：12345678

          🐳 Docker：${{ inputs.include_docker == 'yes' && '已集成' || '未集成' }}

          ## Frame Engine

          Kernel CONFIG_DEVMEM=y

          BusyBox CONFIG_BUSYBOX_CONFIG_DEVMEM=y

          BusyBox devmem applet enabled

          ## Build

          Source Build

          OpenWrt / ImmortalWrt 25.12.x

          Airoha AN7581
          EOF

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.date.outputs.date }}-${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-airoha-an7581-SourceBuild-Docker-${{ inputs.include_docker }}
          body_path: router-info.md
          files: |
            release/*
          token: ${{ secrets.GITHUB_TOKEN }}
